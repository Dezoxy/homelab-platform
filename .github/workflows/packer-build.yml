name: Platform / Base Image
on:
  workflow_dispatch:
    inputs:
      image_id:
        description: Catalog VM image to ensure on Proxmox
        required: true
        type: choice
        default: ubuntu-2604-vm-v1
        options:
          - ubuntu-2604-vm-v1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_ID: ${{ inputs.image_id }}
      ANSIBLE_CONFIG: ansible/ansible.cfg
      ANSIBLE_DEPRECATION_WARNINGS: "False"
      ANSIBLE_HOST_KEY_CHECKING: "True"

    steps:
      - uses: actions/checkout@v7

      - name: Fetch Tailscale secrets from Azure Key Vault
        uses: ./.github/actions/azure-secrets
        with:
          keyvault-name: ${{ vars.AZURE_KEYVAULT_NAME }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          folder: tailscale

      - name: Fetch Proxmox secrets from Azure Key Vault
        uses: ./.github/actions/azure-secrets
        with:
          keyvault-name: ${{ vars.AZURE_KEYVAULT_NAME }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          folder: proxmox

      - name: Fetch SSH secrets from Azure Key Vault
        uses: ./.github/actions/azure-secrets
        with:
          keyvault-name: ${{ vars.AZURE_KEYVAULT_NAME }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          folder: ssh

      - name: Export Packer runtime environment
        shell: bash
        run: bash scripts/ci/export_runtime_env.sh packer

      - id: tailscale
        name: Export Tailscale runtime inputs
        shell: bash
        run: bash scripts/ci/export_runtime_env.sh tailscale-outputs

      - name: Load CI versions
        shell: bash
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' scripts/ci/versions.sh | tr -d '"' >> "$GITHUB_ENV"

      - name: Connect to Tailscale (for LAN access)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ steps.tailscale.outputs.oauth_client_id }}
          oauth-secret: ${{ steps.tailscale.outputs.oauth_secret }}
          tags: tag:github-ci
          version: ${{ env.TAILSCALE_VERSION }}
          hostname: "gh-${{ github.run_id }}-pkr"
          args: --accept-dns=false

      - name: Wait for Proxmox API reachability
        shell: bash
        run: bash scripts/ci/wait_for_proxmox_api.sh

      - name: Ensure Ansible
        shell: bash
        run: bash scripts/ci/ensure_ansible.sh

      - name: Prepare SSH keys
        shell: bash
        run: bash scripts/ci/prepare_ssh_keys.sh

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Ensure catalog VM image
        shell: bash
        run: bash scripts/ci/ensure_target_image.sh

      - name: Debug Proxmox connectivity (on failure)
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/debug_proxmox_connectivity.sh
