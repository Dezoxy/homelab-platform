---
- name: Require resolved image payload
  ansible.builtin.assert:
    that:
      - proxmox_image_resolution is mapping
      - proxmox_image_resolution.image_id | default('') | length > 0
      - proxmox_image_resolution.image is mapping
    fail_msg: "proxmox_image requires a resolved image payload from resolve_image_pin.py."

- name: Require selected Proxmox node
  ansible.builtin.assert:
    that:
      - inventory_hostname == proxmox_image_resolution.image.proxmox_node
    fail_msg: >-
      Resolved image {{ proxmox_image_resolution.image_id }} targets Proxmox node
      {{ proxmox_image_resolution.image.proxmox_node }}, not {{ inventory_hostname }}.

- name: Ensure pinned LXC template archive
  ansible.builtin.include_tasks: lxc.yml
  when: proxmox_image_resolution.image.kind == "lxc-template"

- name: Ensure pinned VM template
  ansible.builtin.include_tasks: vm.yml
  when: proxmox_image_resolution.image.kind == "vm-template"
