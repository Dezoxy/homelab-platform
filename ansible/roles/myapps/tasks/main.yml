---
- name: Derive compose path from myapps_compose_dir
  ansible.builtin.set_fact:
    myapps_compose_file: "{{ myapps_compose_file | default(myapps_compose_dir ~ '/compose.yml') }}"
    myapps_chromium_env_file: "{{ myapps_chromium_env_file | default(myapps_compose_dir ~ '/chromium.env') }}"
    myapps_digest_env_file: "{{ myapps_digest_env_file | default(myapps_compose_dir ~ '/digest.env') }}"
    myapps_jobs_refresh_env_file: "{{ myapps_jobs_refresh_env_file | default(myapps_compose_dir ~ '/jobs-refresh.env') }}"
    myapps_garmin_health_env_file: "{{ myapps_garmin_health_env_file | default(myapps_compose_dir ~ '/garmin-health.env') }}"

- name: Ensure myapps compose directory
  ansible.builtin.file:
    path: "{{ myapps_compose_dir }}"
    state: directory
    mode: "0755"

# Local state: mirror the databases and one-time-login tokens that live on this
# host's LOCAL ext4 disk onto the share, where restic sweeps them to B2. The
# install half (directories + the SQLite-safe mirror script) and the restore
# half run here, BEFORE any service starts. The units are installed at the end
# of this role, never here -- the timer is Persistent=true, so enabling it
# mid-restore can fire an rsync --delete over the snapshot being restored from.
- name: Install local state directories and mirror script
  ansible.builtin.import_role:
    name: local_state_backup
    tasks_from: install

- name: Restore local state from the share when this host has none
  ansible.builtin.import_tasks: local-state-restore.yml

- name: Require a GHCR pull token when notification-digest is enabled
  ansible.builtin.assert:
    that:
      - (myapps_digest_ghcr_pull_token_effective | default(myapps_digest_ghcr_pull_token) | default('')) | length > 0
    fail_msg: >-
      Missing GHCR pull token. ghcr.io/dezoxy/notification-digest is a PRIVATE
      package (its repo is private), so Docker cannot pull it anonymously the
      way it pulls the public netcheck image. Store a read:packages PAT as the
      digest-ghcr-pull-token Key Vault secret (folder=digest,
      envvar=DIGEST_GHCR_PULL_TOKEN), or pass
      -e myapps_digest_ghcr_pull_token=... at deploy.
  when: myapps_digest_enabled | default(false) | bool

# Fail at deploy time, not at the collector's 6-hourly runtime ConfigError,
# when Reddit is enabled without its session cookie -- same rationale as the
# GHCR assert above. The cookie value itself is never printed by assert.
- name: Require the Reddit session cookie when the Reddit collector is enabled
  ansible.builtin.assert:
    that:
      - (myapps_digest_reddit_session_effective | default(myapps_digest_reddit_session) | default('')) | length > 0
    fail_msg: >-
      Missing Reddit session cookie. myapps_digest_reddit_enabled is true but
      no cookie resolved. Store the owner's reddit_session browser cookie as
      the digest-reddit-session Key Vault secret (folder=digest,
      envvar=DIGEST_REDDIT_SESSION), or pass
      -e myapps_digest_reddit_session=... at deploy.
  when:
    - myapps_digest_enabled | default(false) | bool
    - myapps_digest_reddit_enabled | default(false) | bool

# Same shape as the Reddit assert above, with a sharper blast radius: a
# Patreon ConfigError aborts the WHOLE digest run, so an unconfigured cookie
# would take the window, daily and weekly briefs down with it.
#
# POSITION IS LOAD-BEARING: this must run BEFORE the digest.env template
# task below. That template gates the PATREON_* pair on the enable flag, so
# with the flag on and the cookie missing it would render exactly the
# half-configured pair the app refuses to start on -- and an assert that
# fired only AFTER the file was written would abort the play while leaving
# the broken env on disk for the next window timer run to crash against.
# The cookie value itself is never printed by assert.
- name: Require the Patreon session cookie when the Patreon collector is enabled
  ansible.builtin.assert:
    that:
      - (myapps_digest_patreon_session_cookie_effective
         | default(myapps_digest_patreon_session_cookie) | default('')) | length > 0
      - (myapps_digest_patreon_campaign_id | default('')) | length > 0
    fail_msg: >-
      Patreon collector enabled without both of its settings. It needs
      myapps_digest_patreon_campaign_id (the numeric campaign id, not a
      secret) AND the owner's patreon.com session_id cookie. Store the cookie
      as the digest-patreon-session-cookie Key Vault secret (folder=digest,
      envvar=DIGEST_PATREON_SESSION_COOKIE), or pass
      -e myapps_digest_patreon_session_cookie=... at deploy.
  when:
    - myapps_digest_enabled | default(false) | bool
    - myapps_digest_patreon_enabled | default(false) | bool

- name: Assert the positions tracker has a Telegram topic and something to track
  ansible.builtin.assert:
    that:
      - (myapps_digest_telegram_positions_thread_id | default('') | string | trim) | length > 0
      - ((myapps_digest_positions_tg_channels | default('') | trim) | length > 0)
        or ((myapps_digest_positions_x_accounts | default('') | trim) | length > 0)
    fail_msg: >-
      myapps_digest_positions_enabled requires
      myapps_digest_telegram_positions_thread_id AND at least one of
      myapps_digest_positions_tg_channels / myapps_digest_positions_x_accounts.
      Without a topic the app falls back to the WINDOW digest's topic, which
      would drop portfolio updates into the general news feed; with nothing
      to track the timer fires six times a day against a no-op.
  when:
    - myapps_digest_positions_enabled | default(false) | bool

# Fail at deploy time, not at 20:30 in the journal, when a unit's
# TimeoutStartSec no longer covers the app budgets this same role hands the
# container. This exists because that drift already happened silently:
# digest-daily.service failed with Result=timeout every night from at least
# 2026-08-14 to 2026-08-17, delivering the brief and then being SIGINTed
# during teardown, because TimeoutStartSec was hardcoded 600 while the app
# was handed 600 + 600 + up to 1200. Both sides of that comparison are set
# HERE, so it is checkable -- documenting the invariant is what failed last
# time. See the TimeoutStartSec block in defaults/main.yml for the budgets.
#
# Only the daily runs a verify pass, so only its budget includes it. The
# translate budget counts ONCE per run mode even though translate_digest may
# retry on a fallback model, because notification-digest 0.15.0's
# TRANSLATE_TIMEOUT_SECONDS caps each leg -- on an older image the retry is
# unbounded and this assert would understate the real worst case, which is
# why myapps_digest_image must be >= 0.15.0 for this to mean anything.
- name: Require each digest unit's TimeoutStartSec to cover its app budget
  ansible.builtin.assert:
    that:
      - myapps_digest_timeout_start_sec | int >
        (myapps_digest_claude_timeout_seconds | int)
        + (myapps_digest_translate_timeout_seconds | int)
      - myapps_digest_daily_timeout_start_sec | int >
        (myapps_digest_claude_timeout_seconds | int)
        + (myapps_digest_verify_daily_timeout_seconds | int)
        + (myapps_digest_translate_timeout_seconds | int)
      - myapps_digest_weekly_timeout_start_sec | int >
        (myapps_digest_claude_timeout_seconds | int)
        + (myapps_digest_translate_timeout_seconds | int)
    fail_msg: >-
      A digest unit's TimeoutStartSec no longer covers the app timeouts this
      role sets, so systemd would kill a run whose every internal step behaved
      as designed. Budgets: claude={{ myapps_digest_claude_timeout_seconds }},
      verify_daily={{ myapps_digest_verify_daily_timeout_seconds }},
      translate={{ myapps_digest_translate_timeout_seconds }}. Ceilings:
      window={{ myapps_digest_timeout_start_sec }},
      daily={{ myapps_digest_daily_timeout_start_sec }},
      weekly={{ myapps_digest_weekly_timeout_start_sec }}. Raise the ceiling
      or lower a budget -- but note the daily's ceiling is capped near 1500 by
      the Sunday daily->weekly gap (see defaults/main.yml); prefer lowering
      verify_daily, the one phase the app treats as optional.
  when: myapps_digest_enabled | default(false) | bool

# community.docker is not in ansible/requirements.yml, so we shell out -- same
# approach as the dashboard role. The token travels only via stdin, never in
# argv (where it would appear in `ps` output) and never in a log.
- name: Log in to GHCR for the notification-digest image pull
  ansible.builtin.command:
    argv:
      - docker
      - login
      - ghcr.io
      - -u
      - digest-deploy
      - --password-stdin
    stdin: "{{ myapps_digest_ghcr_pull_token_effective | default(myapps_digest_ghcr_pull_token) }}"
  no_log: true
  changed_when: true
  when: myapps_digest_enabled | default(false) | bool

# Pull at DEPLOY time, not at first timer fire. The digest service sits behind
# `profiles: ["oneshot"]`, so `docker compose up -d` never pulls it -- without
# this the image would first be fetched by the 6-hourly timer, turning a bad
# token or a typo'd tag into a silent 06:00 failure in the journal instead of a
# loud, immediate deploy failure.
- name: Pre-pull the notification-digest image
  ansible.builtin.command:
    argv:
      - docker
      - pull
      - "{{ myapps_digest_image }}"
  register: myapps_digest_pull
  changed_when: "'Downloaded newer image' in myapps_digest_pull.stdout"
  when: myapps_digest_enabled | default(false) | bool

# --- Chromium ---
# Unlike digest/jobs-refresh (profiles: ["oneshot"], never part of `up -d`),
# chromium is a long-lived service started by `docker compose up -d` itself
# -- so its bind-mounted profile directory and env file must exist BEFORE
# the compose file is installed and the service is (re)started, mirroring
# T3MP3ST's directory placement above rather than digest's placement below.
- name: Ensure Chromium profile directory
  ansible.builtin.file:
    path: "{{ myapps_chromium_profile_dir }}"
    state: directory
    owner: "{{ myapps_chromium_puid }}"
    group: "{{ myapps_chromium_pgid }}"
    mode: "0750"
  when: myapps_chromium_enabled | default(false) | bool

# CUSTOM_USER/PASSWORD/PUID/PGID/TZ/CHROME_CLI all land here instead of the
# 0644 myapps-compose.yml.j2, mirroring digest.env.j2 -- keeps the UI
# PASSWORD out of the world-readable compose file and off `--diff` output.
- name: Install Chromium environment file
  ansible.builtin.template:
    src: chromium.env.j2
    dest: "{{ myapps_chromium_env_file }}"
    mode: "0600"
  register: myapps_chromium_env_copy
  no_log: true
  when: myapps_chromium_enabled | default(false) | bool

# playwright-mcp joins chromium's network namespace (network_mode:
# "service:chromium" in the compose template) to reach chromium's
# loopback-only CDP port -- it cannot exist without that service. Fail here
# rather than let the compose template render a `depends_on: [chromium]`
# against a service that was never defined.
- name: Require chromium to be enabled when playwright-mcp is enabled
  ansible.builtin.assert:
    that:
      - myapps_chromium_enabled | default(false) | bool
    fail_msg: >-
      myapps_playwright_mcp_enabled requires myapps_chromium_enabled --
      playwright-mcp attaches to chromium's CDP port via
      network_mode: "service:chromium" and cannot run without it.
  when: myapps_playwright_mcp_enabled | default(false) | bool

- name: Install myapps compose file
  ansible.builtin.template:
    src: myapps-compose.yml.j2
    dest: "{{ myapps_compose_file }}"
    mode: "0644"
  register: myapps_compose_copy

- name: Install myapps systemd unit
  ansible.builtin.template:
    src: myapps-compose.service.j2
    dest: /etc/systemd/system/myapps.service
    mode: "0644"
  register: myapps_unit_copy

- name: Record whether myapps deployment changed
  ansible.builtin.set_fact:
    myapps_deploy_changed: >-
      {{
        (myapps_compose_copy.changed | default(false))
        or (myapps_unit_copy.changed | default(false))
        or (myapps_chromium_env_copy.changed | default(false))
      }}

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start myapps service
  ansible.builtin.systemd:
    name: myapps
    enabled: true
    state: >-
      {{
        'restarted'
        if (myapps_restart_on_change | default(true) | bool)
           and (myapps_deploy_changed | bool)
        else 'started'
      }}
  when: myapps_manage_services | bool

# notification-digest's image runs as uid 1000; the container needs write
# access to its bind-mounted state dir (mirrors how observability_stack owns
# data dirs by numeric container UID).
- name: Ensure notification-digest directories owned by the container UID
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: 1000
    group: 1000
    mode: "0750"
  loop:
    - "{{ myapps_digest_state_dir }}"
    - "{{ myapps_digest_archive_dir }}"
    - "{{ myapps_digest_claude_home_dir }}"
  when: myapps_digest_enabled | default(false) | bool

# --- notification-digest state restore (disaster recovery) ---
# The read half of the nightly offsite mirror. Runs BEFORE the compose file
# and the timers below: a digest run starting against a missing state.db
# would create an empty one, and the restore's own guard then refuses to
# overwrite it -- turning a recoverable rebuild into a permanent loss of the
# dedup ledger, plus the duplicate-delivery burst that ledger prevents.
#
# Marker-gated exactly like media_stack's homelab_local_state_marker_name:
# seeding must happen once, on a host with no state, and never again.
- name: Check whether notification-digest state has been seeded
  ansible.builtin.stat:
    path: "{{ myapps_digest_state_marker }}"
  register: myapps_digest_state_marker_stat
  when:
    - myapps_digest_enabled | default(false) | bool
    - myapps_digest_state_restore_enabled | default(false) | bool

- name: Install notification-digest state restore script
  ansible.builtin.template:
    src: digest-state-restore.py.j2
    dest: "{{ myapps_digest_state_restore_script }}"
    mode: "0755"
  when:
    - myapps_digest_enabled | default(false) | bool
    - myapps_digest_state_restore_enabled | default(false) | bool

- name: Restore notification-digest state from the newest valid offsite snapshot
  ansible.builtin.command:
    argv: ["{{ myapps_digest_state_restore_script }}"]
  register: myapps_digest_state_restore
  # The script is idempotent and self-reporting: it exits 0 having done
  # nothing when state.db already exists or no snapshot is available, and
  # non-zero only when it genuinely could not do its job (share unmounted,
  # every snapshot corrupt). Both of those must fail the play -- a host that
  # silently starts with an empty ledger looks healthy and re-delivers
  # everything.
  changed_when: "'restored ' in myapps_digest_state_restore.stdout"
  when:
    - myapps_digest_enabled | default(false) | bool
    - myapps_digest_state_restore_enabled | default(false) | bool
    - not (myapps_digest_state_marker_stat.stat.exists | default(false))

- name: Mark notification-digest state as seeded
  ansible.builtin.copy:
    content: "ok\n"
    dest: "{{ myapps_digest_state_marker }}"
    owner: 1000
    group: 1000
    mode: "0644"
  when:
    - myapps_digest_enabled | default(false) | bool
    - myapps_digest_state_restore_enabled | default(false) | bool
    - not (myapps_digest_state_marker_stat.stat.exists | default(false))

# All digest runtime config (including TG_*/SMTP_* secrets) renders here
# instead of into the 0644 myapps-compose.yml.j2, mirroring how dashboard.env
# and observability.env keep secrets out of the world-readable compose file
# and off `--diff` output.
- name: Install notification-digest environment file
  ansible.builtin.template:
    src: digest.env.j2
    dest: "{{ myapps_digest_env_file }}"
    mode: "0600"
  no_log: true
  when: myapps_digest_enabled | default(false) | bool

# Content comes from the digest-x-cookies Key Vault secret via
# myapps_digest_x_cookies_effective (see ansible/playbooks/services/
# 01-myapps-vm.yml). The file lands under the /data bind mount so
# X_COOKIES_PATH (/data/x-cookies.json) resolves inside the container.
- name: Write notification-digest X cookies file
  ansible.builtin.copy:
    dest: "{{ myapps_digest_state_dir }}/x-cookies.json"
    content: "{{ myapps_digest_x_cookies_effective | default('') }}"
    owner: 1000
    group: 1000
    mode: "0600"
  no_log: true
  when:
    - myapps_digest_enabled | default(false) | bool
    - myapps_digest_x_enabled | default(false) | bool
    - (myapps_digest_x_cookies_effective | default('') | trim | length) > 0

# Shared entrypoint for EVERY notification-digest systemd unit: it takes a
# lock before running `docker compose run`, so two digest modes can never be
# in flight at once. The failure it prevents is a Telegram one, not a SQLite
# one -- see digest-run.sh.j2's own header for the full reasoning.
#
# Installed whenever the digest is enabled at all, unconditionally on the
# per-mode flags: every unit's ExecStart points here, so a mode enabled
# later must not be able to find the script missing. ConditionPathExists on
# the compose file already covers the "nothing deployed yet" case.
- name: Install notification-digest shared run wrapper
  ansible.builtin.template:
    src: digest-run.sh.j2
    dest: "{{ myapps_digest_run_script }}"
    owner: root
    group: root
    mode: "0755"
  when: myapps_digest_enabled | default(false) | bool

# Generic script + env file shared by every myapps scheduled job's failure
# alerting (see myapps-notify.sh.j2). Gated on EITHER digest OR jobs-refresh
# being enabled -- gating on digest alone would silently break jobs-refresh
# alerting whenever digest was off, which is exactly the bug class this
# generalization exists to avoid.
- name: Install myapps failure notification script
  ansible.builtin.template:
    src: myapps-notify.sh.j2
    dest: "{{ myapps_notify_script }}"
    owner: root
    group: root
    mode: "0755"
  when: >-
    (myapps_digest_enabled | default(false) | bool)
    or (myapps_jobs_refresh_enabled | default(false) | bool)
    or (myapps_garmin_health_enabled | default(false) | bool)
    or (myapps_withings_sync_enabled | default(false) | bool)

# The failure-notify script was renamed from the digest-specific
# /usr/local/sbin/digest-notify to the generic path above; nothing
# references the old path anymore. Remove it unconditionally (not gated on
# digest/jobs-refresh) so a previous deploy's script doesn't linger
# unreferenced on the host. Safe to run repeatedly: a no-op once removed.
- name: Remove obsolete digest-notify script
  ansible.builtin.file:
    path: /usr/local/sbin/digest-notify
    state: absent

- name: Ensure myapps notify env file exists (do not overwrite)
  ansible.builtin.copy:
    dest: "{{ myapps_digest_notify_env_file }}"
    owner: root
    group: root
    mode: "0600"
    force: false
    content: |
      # myapps failure notification environment (shared by every scheduled
      # job's OnFailure= alert, e.g. notification-digest, jobs-refresh).
      # Fill these in to receive an alert when a job run fails.
      # Ntfy:
      #   NTFY_URL=https://ntfy.sh (or your self-hosted ntfy base URL)
      #   NTFY_TOPIC=your-topic
      #   NTFY_TOKEN= (optional; for protected topics)
      #
      # Telegram:
      #   TELEGRAM_BOT_TOKEN=
      #   TELEGRAM_CHAT_ID=
      NTFY_URL=https://ntfy.sh
      NTFY_TOPIC=
      NTFY_TOKEN=
      TELEGRAM_BOT_TOKEN=
      TELEGRAM_CHAT_ID=
  when: >-
    (myapps_digest_enabled | default(false) | bool)
    or (myapps_jobs_refresh_enabled | default(false) | bool)

- name: Install myapps notify env file from provided secrets
  ansible.builtin.copy:
    dest: "{{ myapps_digest_notify_env_file }}"
    owner: root
    group: root
    mode: "0600"
    force: true
    content: |
      # Managed by Ansible: ansible/playbooks/services/01-myapps-vm.yml
      NTFY_URL={{ (myapps_digest_notify_ntfy_url_effective | default('https://ntfy.sh')) | quote }}
      NTFY_TOPIC={{ (myapps_digest_notify_ntfy_topic_effective | default('')) | quote }}
      NTFY_TOKEN={{ (myapps_digest_notify_ntfy_token_effective | default('')) | quote }}
      TELEGRAM_BOT_TOKEN={{ (myapps_digest_notify_telegram_bot_token_effective | default('')) | quote }}
      TELEGRAM_CHAT_ID={{ (myapps_digest_notify_telegram_chat_id_effective | default('')) | quote }}
  no_log: true
  when:
    - >-
      (myapps_digest_enabled | default(false) | bool)
      or (myapps_jobs_refresh_enabled | default(false) | bool)
    - >-
      (myapps_digest_notify_ntfy_topic_effective | default('') | trim | length) > 0
      or (
        (myapps_digest_notify_telegram_bot_token_effective | default('') | trim | length) > 0
        and (myapps_digest_notify_telegram_chat_id_effective | default('') | trim | length) > 0
      )

- name: Install notification-digest systemd service
  ansible.builtin.template:
    src: digest.service.j2
    dest: /etc/systemd/system/digest.service
    mode: "0644"
  register: myapps_digest_service_copy
  when: myapps_digest_enabled | default(false) | bool

- name: Install notification-digest systemd timer
  ansible.builtin.template:
    src: digest.timer.j2
    dest: /etc/systemd/system/digest.timer
    mode: "0644"
  register: myapps_digest_timer_copy
  when: myapps_digest_enabled | default(false) | bool

- name: Install notification-digest failure notification systemd service
  ansible.builtin.template:
    src: digest-notify.service.j2
    dest: /etc/systemd/system/digest-notify.service
    mode: "0644"
  register: myapps_digest_notify_service_copy
  when: myapps_digest_enabled | default(false) | bool

- name: Reload systemd for notification-digest
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - myapps_digest_enabled | default(false) | bool
    - (myapps_digest_service_copy.changed | default(false))
      or (myapps_digest_timer_copy.changed | default(false))
      or (myapps_digest_notify_service_copy.changed | default(false))

- name: Enable and start notification-digest timer
  ansible.builtin.systemd:
    name: digest.timer
    enabled: true
    state: started
  when:
    - myapps_digest_enabled | default(false) | bool
    - myapps_manage_services | bool

# The overnight (00 UTC) and evening (18 UTC) window slots run the SAME cycle
# as digest.service, with reader-facing channels suppressed via the app's
# `hide:<channel>` argv. See myapps_digest_on_calendar's comment in
# defaults/main.yml for the three-way split and why the two hidden slots hide
# different channels. Looped rather than written out twice: the unit files are
# identical in shape and differ only by name.
- name: Install notification-digest hidden-slot systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - digest-overnight.service
    - digest-overnight.timer
    - digest-overnight-notify.service
    - digest-evening.service
    - digest-evening.timer
    - digest-evening-notify.service
  register: myapps_digest_hidden_units_copy
  when: myapps_digest_enabled | default(false) | bool

- name: Reload systemd for notification-digest hidden slots
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - myapps_digest_enabled | default(false) | bool
    - myapps_digest_hidden_units_copy.changed | default(false)

- name: Enable and start notification-digest hidden-slot timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - digest-overnight.timer
    - digest-evening.timer
  when:
    - myapps_digest_enabled | default(false) | bool
    - myapps_manage_services | bool

# Retention hygiene + state.db snapshots (app review 2026-08-17, findings
# #10/#11): tmpfiles.d ages the markdown archive (365d) and the snapshot
# dir (7d); a daily oneshot timer takes an online .backup of state.db --
# safe against the live DB because the app runs it in WAL mode (v0.17.0+).
- name: Install notification-digest tmpfiles retention config
  ansible.builtin.template:
    src: digest-tmpfiles.conf.j2
    dest: /etc/tmpfiles.d/digest.conf
    mode: "0644"
  register: myapps_digest_tmpfiles_copy
  when: myapps_digest_enabled | default(false) | bool

- name: Apply notification-digest tmpfiles config (creates backup dir)
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/digest.conf
  when:
    - myapps_digest_enabled | default(false) | bool
    - myapps_digest_tmpfiles_copy.changed | default(false)
  changed_when: true

- name: Install notification-digest backup script
  ansible.builtin.template:
    src: digest-state-backup.py.j2
    dest: /usr/local/bin/digest-state-backup
    mode: "0755"
  when: myapps_digest_enabled | default(false) | bool

- name: Install notification-digest backup service
  ansible.builtin.template:
    src: digest-backup.service.j2
    dest: /etc/systemd/system/digest-backup.service
    mode: "0644"
  register: myapps_digest_backup_service_copy
  when: myapps_digest_enabled | default(false) | bool

- name: Install notification-digest backup timer
  ansible.builtin.template:
    src: digest-backup.timer.j2
    dest: /etc/systemd/system/digest-backup.timer
