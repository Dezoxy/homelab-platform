      or (myapps_digest_weekly_service_stat.stat.exists | default(false))
      or (myapps_digest_weekly_notify_service_stat.stat.exists | default(false))

- name: Reload systemd after notification-digest weekly brief teardown
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - not (myapps_digest_weekly_enabled | default(false) | bool)
    - myapps_digest_weekly_unit_removed.changed | default(false)

# --- jobs-refresh ---
# One-shot container run on a schedule via `docker compose run --rm
# jobs-refresh`, mirroring notification-digest's oneshot pattern. Unlike
# digest (pulled from a private GHCR package), there is no published image to
# pull, so jobs-refresh is built locally from node:22 + git + a pinned Claude
# CLI -- mirroring T3MP3ST's build-locally pattern.
# --- garmin-health (my-health-datas) ---
# One image, two independent one-shot jobs (sync daily, report monthly). Same
# deployment shape as notification-digest above: pinned private GHCR tag,
# pre-pulled at deploy, `profiles: ["oneshot"]` so `up -d` never touches it,
# systemd timers own the scheduling.
#
# Deliberately NOT behind digest-run's flock: that lock exists because four
# digest modes share one Telethon session, which this service never opens.
# jobs-refresh, the other non-digest Claude job, stays out of it too --
# separation here is by schedule (see the calendars in defaults/main.yml).

# The app's own claude timeout must fire BEFORE systemd kills the unit --
# otherwise a slow call dies as an opaque "Result: timeout" with no error
# message, instead of report.py's own "claude -p timed out after Ns". Same
# class of bug the digest timeout assertion above exists to prevent.
- name: Require the garmin-health report unit's TimeoutStartSec to cover its Claude budget
  ansible.builtin.assert:
    that:
      - (myapps_garmin_health_report_timeout_start_sec | int)
        > (myapps_garmin_health_claude_timeout_seconds | int)
    fail_msg: >-
      myapps_garmin_health_report_timeout_start_sec
      ({{ myapps_garmin_health_report_timeout_start_sec }}) must exceed
      myapps_garmin_health_claude_timeout_seconds
      ({{ myapps_garmin_health_claude_timeout_seconds }}), leaving room for the
      stats query and the Telegram uploads on top.
  when: myapps_garmin_health_enabled | default(false) | bool

- name: Require a GHCR pull token when garmin-health is enabled
  ansible.builtin.assert:
    that:
      - (myapps_garmin_health_ghcr_pull_token_effective
         | default(myapps_garmin_health_ghcr_pull_token) | trim | length) > 0
    fail_msg: >-
      myapps_garmin_health_enabled is true but no GHCR pull token is set.
      ghcr.io/dezoxy/my-health-datas is a PRIVATE package: store a
      read:packages PAT as the garmin-ghcr-pull-token Key Vault secret
      (folder=garmin, envvar=GARMIN_GHCR_PULL_TOKEN) before enabling.
  when: myapps_garmin_health_enabled | default(false) | bool

# community.docker is not in ansible/requirements.yml, so we shell out -- same
# approach as digest above. The token travels only via stdin, never in argv
# (where it would appear in `ps` output) and never in a log.
#
# NOTE: this runs AFTER digest's ghcr.io login, so its credential is the one
# left in root's ~/.docker/config.json. That only matters if an image ever has
# to be pulled outside a deploy; the pre-pull below means a normal timer fire
# never pulls. Keep both tokens scoped to read:packages on the whole dezoxy
# org rather than a single package, and the ordering stops mattering.
- name: Log in to GHCR for the garmin-health image pull
  ansible.builtin.command:
    argv:
      - docker
      - login
      - ghcr.io
      - -u
      - garmin-deploy
      - --password-stdin
    stdin: "{{ myapps_garmin_health_ghcr_pull_token_effective | default(myapps_garmin_health_ghcr_pull_token) }}"
  no_log: true
  changed_when: true
  when: myapps_garmin_health_enabled | default(false) | bool

# Pull at DEPLOY time, not at first timer fire: the service sits behind
# `profiles: ["oneshot"]` so `docker compose up -d` never pulls it. Without
# this a bad token or a typo'd tag would first surface as a silent 03:30
# failure in the journal instead of a loud, immediate deploy failure.
- name: Pre-pull the garmin-health image
  ansible.builtin.command:
    argv:
      - docker
      - pull
      - "{{ myapps_garmin_health_image }}"
  register: myapps_garmin_health_pull
  changed_when: "'Downloaded newer image' in myapps_garmin_health_pull.stdout"
  when: myapps_garmin_health_enabled | default(false) | bool

# uid/gid 1000 matches the image's non-root `garmin` user. mode 0750 rather
# than 0755: this tree holds personal health data plus two live credential
# directories (garth OAuth tokens, Claude CLI auth).
- name: Ensure garmin-health directories owned by the container UID
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: 1000
    group: 1000
    mode: "0750"
  loop:
    - "{{ myapps_garmin_health_state_dir }}"
    - "{{ myapps_garmin_health_reports_dir }}"
    - "{{ myapps_garmin_health_garmin_tokens_dir }}"
    - "{{ myapps_garmin_health_claude_home_dir }}"
  when: myapps_garmin_health_enabled | default(false) | bool

- name: Install garmin-health environment file
  ansible.builtin.template:
    src: garmin-health.env.j2
    dest: "{{ myapps_garmin_health_env_file }}"
    mode: "0600"
  no_log: true
  when: myapps_garmin_health_enabled | default(false) | bool

# garmin-health's OnFailure= units point the shared notify script at THIS env
# file instead of the myapps-wide one (see garmin-sync-notify.service.j2), so
# health alerts land on the dedicated health bot. Rendered only when both
# credentials are present -- a half-configured pair would leave the script
# with no target, which it already treats as "nothing to do".
- name: Install garmin-health notify env file
  ansible.builtin.copy:
    dest: "{{ myapps_garmin_health_notify_env_file }}"
    owner: root
    group: root
    mode: "0600"
    force: true
    content: |
      # Managed by Ansible: ansible/playbooks/services/01-myapps-vm.yml
      # Dedicated health bot -- deliberately NOT the shared myapps alert bot.
      TELEGRAM_BOT_TOKEN={{ (myapps_garmin_health_telegram_bot_token_effective | default('')) | quote }}
      TELEGRAM_CHAT_ID={{ (myapps_garmin_health_telegram_chat_id_effective | default('')) | quote }}
  no_log: true
  when:
    - myapps_garmin_health_enabled | default(false) | bool
    - (myapps_garmin_health_telegram_bot_token_effective | default('') | trim | length) > 0
    - (myapps_garmin_health_telegram_chat_id_effective | default('') | trim | length) > 0

- name: Install garmin-health systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - garmin-sync.service
    - garmin-sync.timer
    - garmin-sync-notify.service
    - garmin-report.service
    - garmin-report.timer
    - garmin-report-notify.service
  register: myapps_garmin_health_units_copy
  when: myapps_garmin_health_enabled | default(false) | bool

- name: Reload systemd for garmin-health
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - myapps_garmin_health_enabled | default(false) | bool
    - myapps_garmin_health_units_copy.changed | default(false)

- name: Enable and start garmin-health timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - garmin-sync.timer
    - garmin-report.timer
  when:
    - myapps_garmin_health_enabled | default(false) | bool
    - myapps_manage_services | bool

# --- garmin-health teardown (when disabled) ---
# Mirrors the digest teardown above: flipping the flag off must actually stop
# the timers and remove the units, not just skip the install tasks and leave a
# stale timer firing against a compose file that no longer defines the service.
- name: Check for garmin-health timer units when disabled
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  register: myapps_garmin_health_timer_stat
  loop:
    - garmin-sync.timer
    - garmin-report.timer
  when: not (myapps_garmin_health_enabled | default(false) | bool)

- name: Stop and disable garmin-health timers when disabled
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    enabled: false
    state: stopped
  loop: "{{ myapps_garmin_health_timer_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when:
    - not (myapps_garmin_health_enabled | default(false) | bool)
    - myapps_manage_services | bool
    - item.stat.exists | default(false)

- name: Check for garmin-health service units when disabled
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  register: myapps_garmin_health_service_stat
  loop:
    - garmin-sync.service
    - garmin-report.service
  when: not (myapps_garmin_health_enabled | default(false) | bool)

- name: Stop garmin-health services when disabled
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    state: stopped
  loop: "{{ myapps_garmin_health_service_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when:
    - not (myapps_garmin_health_enabled | default(false) | bool)
    - myapps_manage_services | bool
    - item.stat.exists | default(false)

# The env files go too: garmin-health.env holds the Telegram bot token, and a
# disabled service has no reason to leave a live credential on disk. The state
# dir under /srv/appdata is deliberately NOT removed -- it holds the immutable
# raw dumps and both login dirs, none of which are re-creatable unattended.
- name: Remove garmin-health units and env files when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/garmin-sync.service
    - /etc/systemd/system/garmin-sync.timer
    - /etc/systemd/system/garmin-sync-notify.service
    - /etc/systemd/system/garmin-report.service
    - /etc/systemd/system/garmin-report.timer
    - /etc/systemd/system/garmin-report-notify.service
    - "{{ myapps_garmin_health_env_file }}"
    - "{{ myapps_garmin_health_notify_env_file }}"
  register: myapps_garmin_health_units_removed
  when: not (myapps_garmin_health_enabled | default(false) | bool)

- name: Reload systemd after garmin-health teardown
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - not (myapps_garmin_health_enabled | default(false) | bool)
    - myapps_garmin_health_units_removed.changed | default(false)

# --- withings-sync ---
# Bridges the Withings scale into Garmin Connect so garmin-health's daily
# fetch sees the weigh-ins. Same shape as garmin-health minus the env files:
# it has no secrets, only the two token files in its state dir. Its failure
# alerts reuse garmin-health's notify env file (dedicated health bot), which
# is why it cannot be enabled without garmin-health.
- name: Require garmin-health when withings-sync is enabled
  ansible.builtin.assert:
    that:
      - myapps_garmin_health_enabled | default(false) | bool
    fail_msg: >-
      myapps_withings_sync_enabled is true but myapps_garmin_health_enabled is
      not. withings-sync only exists to feed garmin-health, and its OnFailure=
      alert goes through garmin-health's notify env file.
  when: myapps_withings_sync_enabled | default(false) | bool

- name: Require a Garmin username when withings-sync is enabled
  ansible.builtin.assert:
    that:
      - (myapps_withings_sync_garmin_username | default('') | trim | length) > 0
    fail_msg: >-
      myapps_withings_sync_enabled is true but
      myapps_withings_sync_garmin_username is empty. Without it withings-sync
      "succeeds" while uploading nothing — the username is the destination
      selector, not a credential. Set it in host_vars.
  when: myapps_withings_sync_enabled | default(false) | bool

- name: Pre-pull the withings-sync image
  ansible.builtin.command:
    argv:
      - docker
      - pull
      - "{{ myapps_withings_sync_image }}"
  register: myapps_withings_sync_pull
  changed_when: "'Downloaded newer image' in myapps_withings_sync_pull.stdout"
  when: myapps_withings_sync_enabled | default(false) | bool

# uid/gid 1000 matches the image's non-root user. 0700: the directory holds
# nothing but two live token files.
# BOTH directories, explicitly. .garmin_session is where the Garmin token
# mint (see the host_vars runbook) bind-mounts; if the role does not create
# it, Docker auto-creates it root-owned on first mount and the uid-1000
# container gets Permission denied writing tokens — observed live 2026-08-24,
# costing a burned single-use MFA code.
- name: Ensure withings-sync state directories owned by the container UID
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0700"
  loop:
    - "{{ myapps_withings_sync_state_dir }}"
    - "{{ myapps_withings_sync_state_dir }}/.garmin_session"
  when: myapps_withings_sync_enabled | default(false) | bool

- name: Install withings-sync systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - withings-sync.service
    - withings-sync.timer
    - withings-sync-notify.service
  register: myapps_withings_sync_units_copy
  when: myapps_withings_sync_enabled | default(false) | bool

- name: Reload systemd for withings-sync
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - myapps_withings_sync_enabled | default(false) | bool
    - myapps_withings_sync_units_copy.changed | default(false)

- name: Enable and start withings-sync timer
  ansible.builtin.systemd:
    name: withings-sync.timer
    enabled: true
    state: started
  when:
    - myapps_withings_sync_enabled | default(false) | bool
    - myapps_manage_services | bool

# --- withings-sync teardown (when disabled) ---
- name: Check for the withings-sync timer unit when disabled
  ansible.builtin.stat:
    path: /etc/systemd/system/withings-sync.timer
  register: myapps_withings_sync_timer_stat
  when: not (myapps_withings_sync_enabled | default(false) | bool)

- name: Stop and disable the withings-sync timer when disabled
  ansible.builtin.systemd:
    name: withings-sync.timer
    enabled: false
    state: stopped
  when:
    - not (myapps_withings_sync_enabled | default(false) | bool)
    - myapps_manage_services | bool
    - myapps_withings_sync_timer_stat.stat.exists | default(false)

- name: Check for the withings-sync service unit when disabled
  ansible.builtin.stat:
    path: /etc/systemd/system/withings-sync.service
  register: myapps_withings_sync_service_stat
  when: not (myapps_withings_sync_enabled | default(false) | bool)

- name: Stop the withings-sync service when disabled
  ansible.builtin.systemd:
    name: withings-sync.service
    state: stopped
  when:
    - not (myapps_withings_sync_enabled | default(false) | bool)
    - myapps_manage_services | bool
    - myapps_withings_sync_service_stat.stat.exists | default(false)

# The state dir stays: it holds the two login tokens, neither re-creatable
# unattended.
- name: Remove withings-sync units when disabled
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - withings-sync.service
    - withings-sync.timer
    - withings-sync-notify.service
  register: myapps_withings_sync_units_removed
  when: not (myapps_withings_sync_enabled | default(false) | bool)

- name: Reload systemd after withings-sync teardown
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - not (myapps_withings_sync_enabled | default(false) | bool)
    - myapps_withings_sync_units_removed.changed | default(false)

- name: Ensure jobs-refresh directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ myapps_jobs_refresh_build_dir }}"
      mode: "0755"
    - path: "{{ myapps_jobs_refresh_repo_dir }}"
      mode: "0755"
    - path: "{{ myapps_jobs_refresh_employee_cv_dir }}"
      mode: "0755"
    - path: "{{ myapps_jobs_refresh_claude_home_dir }}"
      mode: "0775"
    - path: "{{ myapps_jobs_refresh_ssh_key_dir }}"
      mode: "0700"
  when: myapps_jobs_refresh_enabled | default(false) | bool

# The container runs as myapps_jobs_refresh_container_uid/_gid, not root
# (see defaults/main.yml), so these three bind-mounted paths need to be
# owned by that same uid:gid -- the checkout is written every run, and an
# unwritable claude-home breaks Claude's token refresh. `recurse: true`
# matters here beyond the moment of creation: on a host where this already
# ran as root (a real checkout, a real hand-authenticated claude-home), the
# existing content is root-owned too, and this fixes it in place without
# deleting or recreating anything. build_dir (docker build context) and
# ssh_key_dir (holds the root-owned deploy keys, fixed individually below)
# are deliberately excluded -- the container never touches either directly.
- name: Fix ownership of jobs-refresh bind-mounted paths for the non-root container user
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    recurse: true
    owner: "{{ myapps_jobs_refresh_container_uid }}"
    group: "{{ myapps_jobs_refresh_container_gid }}"
  loop:
    - "{{ myapps_jobs_refresh_repo_dir }}"
    - "{{ myapps_jobs_refresh_employee_cv_dir }}"
    - "{{ myapps_jobs_refresh_claude_home_dir }}"
  when: myapps_jobs_refresh_enabled | default(false) | bool

# Ansible never generates/fetches these -- they're per-repo GitHub deploy
# keys (dashboard: write, employee-cv: read-only) placed on the host
# out-of-band. Fail loudly at deploy time rather than let jobs-refresh.timer
# discover a missing key at 3am: the bind mount in myapps-compose.yml.j2
# would otherwise silently create an empty directory at the container path
# instead of the expected key file.
- name: Check for jobs-refresh SSH deploy keys
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ myapps_jobs_refresh_ssh_key_dashboard_path }}"
    - "{{ myapps_jobs_refresh_ssh_key_employee_cv_path }}"
  register: myapps_jobs_refresh_ssh_key_stat
  when: myapps_jobs_refresh_enabled | default(false) | bool

- name: Require jobs-refresh SSH deploy keys to exist
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
    fail_msg: >-
      Missing SSH deploy key at {{ item.item }}. jobs-refresh needs a
      write-access deploy key for Dezoxy/jobs-dashboard
      (myapps_jobs_refresh_ssh_key_dashboard_path) and a read-only deploy
      key for Dezoxy/employee-cv (myapps_jobs_refresh_ssh_key_employee_cv_path),
      placed on this host out-of-band -- Ansible does not generate or fetch
      them.
  loop: "{{ myapps_jobs_refresh_ssh_key_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: myapps_jobs_refresh_enabled | default(false) | bool

# OpenSSH's client-side private-key loader independently refuses a key on
# TWO checks: (1) group/other permission bits must be zero ("UNPROTECTED
# PRIVATE KEY FILE"), and (2) the file's owning uid must match the calling
# process's uid, UNLESS that process is uid 0. The container calls this as
# myapps_jobs_refresh_container_uid (not root -- see defaults/main.yml), so
# check (2) means the key must be OWNED by that uid, not merely root with a
# permissive mode -- group-readable-by-root would satisfy nothing here and
# still fail check (1). Ansible doesn't manage the key's content, but it's
# cheap and safe to fix ownership/mode on whatever the operator dropped in.
- name: Fix ownership and permissions on jobs-refresh SSH deploy keys for the non-root container user
  ansible.builtin.file:
    path: "{{ item.item }}"
    owner: "{{ myapps_jobs_refresh_container_uid }}"
    group: "{{ myapps_jobs_refresh_container_gid }}"
    mode: "0600"
  loop: "{{ myapps_jobs_refresh_ssh_key_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - myapps_jobs_refresh_enabled | default(false) | bool
    - item.stat.exists | default(false)

- name: Install jobs-refresh Dockerfile
  ansible.builtin.template:
    src: jobs-refresh.Dockerfile.j2
    dest: "{{ myapps_jobs_refresh_build_dir }}/Dockerfile"
    mode: "0644"
  register: myapps_jobs_refresh_dockerfile
  when: myapps_jobs_refresh_enabled | default(false) | bool

- name: Install jobs-refresh build args marker
  ansible.builtin.template:
    src: jobs-refresh-build-args.env.j2
    dest: "{{ myapps_jobs_refresh_build_dir }}/build-args.env"
    mode: "0644"
  register: myapps_jobs_refresh_build_args
  when: myapps_jobs_refresh_enabled | default(false) | bool

# NOT baked into the image (see jobs-refresh.Dockerfile.j2's CMD comment) --
# rendered onto the host and bind-mounted read-only at container run time,
# so bootstrap-mechanics tweaks are a redeploy, not an image rebuild.
- name: Install jobs-refresh bootstrap script
  ansible.builtin.template:
    src: jobs-refresh-bootstrap.sh.j2
    dest: "{{ myapps_jobs_refresh_bootstrap_script }}"
    mode: "0755"
  when: myapps_jobs_refresh_enabled | default(false) | bool

- name: Check jobs-refresh image
  ansible.builtin.command: docker image inspect "{{ myapps_jobs_refresh_image }}"
  register: myapps_jobs_refresh_image_inspect
  changed_when: false
  failed_when: false
  when: myapps_jobs_refresh_enabled | default(false) | bool

- name: Build jobs-refresh image
  ansible.builtin.command: >-
    docker build
    -f {{ myapps_jobs_refresh_build_dir }}/Dockerfile
    --build-arg CLAUDE_CLI_VERSION={{ myapps_jobs_refresh_claude_cli_version }}
    -t {{ myapps_jobs_refresh_image }}
    {{ myapps_jobs_refresh_build_dir }}
  register: myapps_jobs_refresh_build
  when:
    - myapps_jobs_refresh_enabled | default(false) | bool
    - myapps_jobs_refresh_force_build | bool
      or (myapps_jobs_refresh_dockerfile is defined and myapps_jobs_refresh_dockerfile is changed)
      or (myapps_jobs_refresh_build_args is defined and myapps_jobs_refresh_build_args is changed)
      or (myapps_jobs_refresh_image_inspect is defined and myapps_jobs_refresh_image_inspect.rc != 0)

# Fail at deploy time, not as a silent runtime skip, when the tracker sync
# URL is set but its Access service token did not resolve -- refresh-run.sh's
# step 2b would log "skipping" every 6 hours and the feedback loop would be
# quietly off. Same rationale as the GHCR assert above. The secret values
# are never printed by assert.
- name: Require the tracker service token when the tracker sync URL is set
  ansible.builtin.assert:
    that:
      - (myapps_jobs_refresh_tracker_client_id_effective | default(myapps_jobs_refresh_tracker_client_id) | default('')) | length > 0
      - (myapps_jobs_refresh_tracker_client_secret_effective | default(myapps_jobs_refresh_tracker_client_secret) | default('')) | length > 0
    fail_msg: >-
      myapps_jobs_refresh_tracker_sync_url is set but the Access service
      token did not resolve. Store the jobs-tracker-client-id /
      jobs-tracker-client-secret Key Vault secrets (folder=jobs-refresh,
      envvar=JOBS_TRACKER_CLIENT_ID / JOBS_TRACKER_CLIENT_SECRET — minted by
      cloudflare-terraform's jobs_refresh service token), and make sure
      scripts/ci/target_secret_folders.sh lists jobs-refresh for this host.
  when:
    - myapps_jobs_refresh_enabled | default(false) | bool
    - (myapps_jobs_refresh_tracker_sync_url | default('') | trim) | length > 0

# Fail at deploy time, not as a silent runtime skip, when the digest is
# enabled but its credentials did not resolve -- refresh-run.sh would call
# notify-telegram.sh, which exits 1 on a missing token, and every run would
# end in the exit-9 undelivered-digest alert. Same rationale as the tracker
# assert above. The secret values are never printed by assert.
- name: Require Telegram credentials when the jobs-refresh digest is enabled
  ansible.builtin.assert:
    that:
      - (myapps_jobs_refresh_telegram_bot_token_effective | default(myapps_jobs_refresh_telegram_bot_token) | default('')) | length > 0
      - (myapps_jobs_refresh_telegram_chat_id_effective | default(myapps_jobs_refresh_telegram_chat_id) | default('')) | length > 0
    fail_msg: >-
      myapps_jobs_refresh_notify_enabled is true but the Telegram credentials
      did not resolve. Store the jobs-telegram-bot-token /
      jobs-telegram-chat-id Key Vault secrets (folder=jobs-refresh,
      envvar=JOBS_REFRESH_TELEGRAM_BOT_TOKEN / JOBS_REFRESH_TELEGRAM_CHAT_ID)
      — the "Job Agent" bot and the owner's private chat, NOT the
      digest-notify alert bot.
  when:
    - myapps_jobs_refresh_enabled | default(false) | bool
    - myapps_jobs_refresh_notify_enabled | default(false) | bool

# ANTHROPIC_MODEL isn't a secret, but the file still lands at 0600 (mirrors
# digest.env.j2's env_file, kept out of the world-readable compose file).
- name: Install jobs-refresh environment file
  ansible.builtin.template:
    src: jobs-refresh.env.j2
    dest: "{{ myapps_jobs_refresh_env_file }}"
    mode: "0600"
  when: myapps_jobs_refresh_enabled | default(false) | bool

# The MCP config jobs-refresh's Claude CLI loads points at playwright-mcp by
# name (see jobs-refresh-mcp-config.json.j2) -- enabling the browse step
# without that server would hand refresh-run.sh a browser tool that can
# never connect.
- name: Require playwright-mcp to be enabled when jobs-refresh browser support is enabled
  ansible.builtin.assert:
    that:
      - myapps_playwright_mcp_enabled | default(false) | bool
    fail_msg: >-
      myapps_jobs_refresh_browser_enabled requires myapps_playwright_mcp_enabled
      -- the MCP config jobs-refresh loads points at the playwright-mcp
      server (reached as chromium:{{ myapps_playwright_mcp_port }}); without it there is
      nothing for the browse step to connect to.
  when:
    - myapps_jobs_refresh_enabled | default(false) | bool
    - myapps_jobs_refresh_browser_enabled | default(false) | bool

# Contains no secrets (just a service-name URL), but 0644 also matters
# functionally here: jobs-refresh's container runs as uid 1000, not root
# (see myapps_jobs_refresh_container_uid above), and this file stays
# root-owned -- 0644's "other" read bit is what makes it readable to that
# uid, mirroring how jobs-refresh-bootstrap.sh (root-owned, 0755) is
# readable/executable by the same non-root user.
- name: Install jobs-refresh MCP config file
  ansible.builtin.template:
    src: jobs-refresh-mcp-config.json.j2
    dest: "{{ myapps_jobs_refresh_mcp_config_path }}"
    mode: "0644"
  when:
    - myapps_jobs_refresh_enabled | default(false) | bool
    - myapps_jobs_refresh_browser_enabled | default(false) | bool

- name: Install jobs-refresh systemd service
  ansible.builtin.template:
    src: jobs-refresh.service.j2
    dest: /etc/systemd/system/jobs-refresh.service
    mode: "0644"
  register: myapps_jobs_refresh_service_copy
  when: myapps_jobs_refresh_enabled | default(false) | bool

- name: Install jobs-refresh systemd timer
  ansible.builtin.template:
    src: jobs-refresh.timer.j2
    dest: /etc/systemd/system/jobs-refresh.timer
    mode: "0644"
  register: myapps_jobs_refresh_timer_copy
  when: myapps_jobs_refresh_enabled | default(false) | bool

- name: Install jobs-refresh failure notification systemd service
  ansible.builtin.template:
    src: jobs-refresh-notify.service.j2
    dest: /etc/systemd/system/jobs-refresh-notify.service
    mode: "0644"
  register: myapps_jobs_refresh_notify_service_copy
  when: myapps_jobs_refresh_enabled | default(false) | bool

- name: Reload systemd for jobs-refresh
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - myapps_jobs_refresh_enabled | default(false) | bool
    - (myapps_jobs_refresh_service_copy.changed | default(false))
      or (myapps_jobs_refresh_timer_copy.changed | default(false))
      or (myapps_jobs_refresh_notify_service_copy.changed | default(false))

- name: Enable and start jobs-refresh timer
  ansible.builtin.systemd:
    name: jobs-refresh.timer
    enabled: true
    state: started
  when:
    - myapps_jobs_refresh_enabled | default(false) | bool
    - myapps_manage_services | bool

# Idempotent teardown, mirroring notification-digest's: jobs-refresh is
# one-shot and never part of `up -d`, so `--remove-orphans` never touches it.
- name: Check for jobs-refresh timer unit when disabled
  ansible.builtin.stat:
    path: /etc/systemd/system/jobs-refresh.timer
  register: myapps_jobs_refresh_timer_stat
  when: not (myapps_jobs_refresh_enabled | default(false) | bool)

- name: Stop and disable jobs-refresh timer when disabled
  ansible.builtin.systemd:
    name: jobs-refresh.timer
    enabled: false
    state: stopped
  when:
    - not (myapps_jobs_refresh_enabled | default(false) | bool)
    - myapps_jobs_refresh_timer_stat.stat.exists | default(false)

- name: Check for jobs-refresh service unit when disabled
  ansible.builtin.stat:
    path: /etc/systemd/system/jobs-refresh.service
  register: myapps_jobs_refresh_service_stat
  when: not (myapps_jobs_refresh_enabled | default(false) | bool)

- name: Stop jobs-refresh service when disabled
  ansible.builtin.systemd:
    name: jobs-refresh.service
    state: stopped
  when:
    - not (myapps_jobs_refresh_enabled | default(false) | bool)
    - myapps_jobs_refresh_service_stat.stat.exists | default(false)

- name: Check for jobs-refresh failure notification unit when disabled
  ansible.builtin.stat:
    path: /etc/systemd/system/jobs-refresh-notify.service
  register: myapps_jobs_refresh_notify_service_stat
  when: not (myapps_jobs_refresh_enabled | default(false) | bool)

- name: Remove jobs-refresh systemd units when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/jobs-refresh.timer
    - /etc/systemd/system/jobs-refresh.service
    - /etc/systemd/system/jobs-refresh-notify.service
  register: myapps_jobs_refresh_unit_removed
  when:
    - not (myapps_jobs_refresh_enabled | default(false) | bool)
    - (myapps_jobs_refresh_timer_stat.stat.exists | default(false))
      or (myapps_jobs_refresh_service_stat.stat.exists | default(false))
      or (myapps_jobs_refresh_notify_service_stat.stat.exists | default(false))

- name: Reload systemd after jobs-refresh teardown
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - not (myapps_jobs_refresh_enabled | default(false) | bool)
    - myapps_jobs_refresh_unit_removed.changed | default(false)

- name: Prune dangling Docker images after myapps deploy
  ansible.builtin.command:
    argv:
      - docker
      - image
      - prune
      - -f
  register: myapps_docker_image_prune
  changed_when: "'Total reclaimed space: 0B' not in (myapps_docker_image_prune.stdout | default(''))"
  when:
    - myapps_manage_services | bool
    - myapps_prune_images_after_deploy | bool
    - myapps_deploy_changed | bool

# Last, deliberately: see the note at the top of this role and in
# local_state_backup/tasks/units.yml. The timer must not be startable until the
# restore above has finished.
- name: Install and enable the local state backup units
  ansible.builtin.import_role:
    name: local_state_backup
    tasks_from: units
