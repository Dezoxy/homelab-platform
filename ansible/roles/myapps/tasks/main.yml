    - /etc/systemd/system/digest-notify.service
    - /etc/systemd/system/digest-overnight.timer
    - /etc/systemd/system/digest-overnight.service
    - /etc/systemd/system/digest-overnight-notify.service
    - /etc/systemd/system/digest-evening.timer
    - /etc/systemd/system/digest-evening.service
    - /etc/systemd/system/digest-evening-notify.service
    - /etc/systemd/system/digest-backup.timer
    - /etc/systemd/system/digest-backup.service
    - /etc/systemd/system/digest-backup-notify.service
    - /usr/local/bin/digest-state-backup
