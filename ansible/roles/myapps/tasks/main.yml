  failed_when: false
  when: not (myapps_digest_enabled | default(false) | bool)

# digest-notify.service is only ever started as digest.service's OnFailure=
# target, never enabled/persistently running, so there is nothing to stop --
# just remove the unit file below alongside the timer+service.
