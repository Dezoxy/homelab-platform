---
# Installed and enabled AFTER any restore, never before. The timer carries
# Persistent=true, so `state: started` can fire the backup immediately if the
# last scheduled run was missed -- and the script rsyncs with --delete. Enable
# it while a host is still mid-restore and it mirrors empty local state over
# the good snapshot on the share, destroying the thing being restored from.

- name: Install local state backup service
  ansible.builtin.template:
    src: homelab-local-state-backup.service.j2
    dest: /etc/systemd/system/homelab-local-state-backup.service
    mode: "0644"
  register: local_state_backup_service_copy

- name: Install local state backup timer
  ansible.builtin.template:
    src: homelab-local-state-backup.timer.j2
    dest: /etc/systemd/system/homelab-local-state-backup.timer
    mode: "0644"
  register: local_state_backup_timer_copy

- name: Reload systemd for local state backup units
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - (local_state_backup_script_copy.changed | default(false))
      or (local_state_backup_service_copy.changed | default(false))
      or (local_state_backup_timer_copy.changed | default(false))

- name: Enable and start local state backup timer
  ansible.builtin.systemd:
    name: homelab-local-state-backup.timer
    enabled: true
    state: started
  when:
    - local_state_backup_timer_enabled | bool
    - (homelab_local_state_paths | length) > 0
