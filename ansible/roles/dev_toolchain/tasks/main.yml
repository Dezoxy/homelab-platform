---
- name: Install base build tooling
  ansible.builtin.apt:
    name: "{{ dev_toolchain_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: dev_toolchain_enabled | bool

- name: Generate a UTF-8 locale
  community.general.locale_gen:
    name: "{{ dev_toolchain_locale }}"
    state: present
  when: dev_toolchain_enabled | bool

- name: Make it the system default
  ansible.builtin.copy:
    dest: /etc/default/locale
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/dev_toolchain).
      LANG={{ dev_toolchain_locale }}
      LC_ALL={{ dev_toolchain_locale }}
  when: dev_toolchain_enabled | bool

- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: dev_toolchain_enabled | bool

# --- Python 3.13 (deadsnakes) -------------------------------------------------

# Fetched once, not on every deploy. Two reasons:
#   - get_url probes the URL with HEAD under --check, and keyserver.ubuntu.com
#     answers 405 Method Not Allowed, which failed every `make deploy-check` on
#     this host even though the key was already present.
#   - a signing key that has not changed is not worth five retries against a
#     public keyserver on each run.
# If the key ever rotates, delete /etc/apt/keyrings/deadsnakes.asc and its
# keyring and re-deploy; the conversion task below is already `creates:`-guarded
# the same way.
- name: Check for the deadsnakes signing key
  ansible.builtin.stat:
    path: /etc/apt/keyrings/deadsnakes.asc
  register: dev_toolchain_deadsnakes_key_stat
  when: dev_toolchain_enabled | bool

- name: Fetch the deadsnakes signing key
  ansible.builtin.get_url:
    url: "{{ dev_toolchain_deadsnakes_key_url }}"
    dest: /etc/apt/keyrings/deadsnakes.asc
    mode: "0644"
  register: dev_toolchain_deadsnakes_key
  retries: 5
  delay: 6
  until: dev_toolchain_deadsnakes_key is succeeded
  when:
    - dev_toolchain_enabled | bool
    - not (dev_toolchain_deadsnakes_key_stat.stat.exists | default(false))

- name: Convert the deadsnakes key to a keyring
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o {{ dev_toolchain_deadsnakes_keyring }} /etc/apt/keyrings/deadsnakes.asc"
    creates: "{{ dev_toolchain_deadsnakes_keyring }}"
  when: dev_toolchain_enabled | bool

- name: Add the deadsnakes apt repo
  ansible.builtin.apt_repository:
    repo: "{{ dev_toolchain_deadsnakes_repo }}"
    filename: deadsnakes
    state: present
    update_cache: true
  when: dev_toolchain_enabled | bool

- name: Install the interpreter the Makefile requires
  ansible.builtin.apt:
    name:
      - "python{{ dev_toolchain_python_version }}"
      - "python{{ dev_toolchain_python_version }}-venv"
      - "python{{ dev_toolchain_python_version }}-dev"
    state: present
  when: dev_toolchain_enabled | bool

# --- Terraform (HashiCorp) ----------------------------------------------------

- name: Fetch the HashiCorp signing key
  ansible.builtin.get_url:
    url: "{{ dev_toolchain_hashicorp_key_url }}"
    dest: /etc/apt/keyrings/hashicorp.asc
    mode: "0644"
  when: dev_toolchain_enabled | bool

- name: Convert the HashiCorp key to a keyring
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o {{ dev_toolchain_hashicorp_keyring }} /etc/apt/keyrings/hashicorp.asc"
    creates: "{{ dev_toolchain_hashicorp_keyring }}"
  when: dev_toolchain_enabled | bool

- name: Add the HashiCorp apt repo
  ansible.builtin.apt_repository:
    repo: "{{ dev_toolchain_hashicorp_repo }}"
    filename: hashicorp
    state: present
    update_cache: true
  when: dev_toolchain_enabled | bool

# Read from scripts/ci/versions.sh on the CONTROLLER so CI and this guest cannot
# disagree about which Terraform the repo targets.
- name: Read the pinned Terraform version from versions.sh
  ansible.builtin.set_fact:
    dev_toolchain_terraform_version: >-
      {{
        (lookup('file', role_path ~ '/../../../scripts/ci/versions.sh')
         | regex_search('TERRAFORM_VERSION="([^"]+)"', '\1'))[0]
      }}
  when: dev_toolchain_enabled | bool

- name: Install the pinned Terraform
  ansible.builtin.apt:
    name: "terraform={{ dev_toolchain_terraform_version }}-*"
    state: present
    allow_downgrade: true
  when: dev_toolchain_enabled | bool

# --- Azure CLI ----------------------------------------------------------------

- name: Fetch the Microsoft signing key
  ansible.builtin.get_url:
    url: "{{ dev_toolchain_microsoft_key_url }}"
    dest: /etc/apt/keyrings/microsoft.asc
    mode: "0644"
  when:
    - dev_toolchain_enabled | bool
    - dev_toolchain_azure_cli_enabled | bool

- name: Convert the Microsoft key to a keyring
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o {{ dev_toolchain_microsoft_keyring }} /etc/apt/keyrings/microsoft.asc"
    creates: "{{ dev_toolchain_microsoft_keyring }}"
  when:
    - dev_toolchain_enabled | bool
    - dev_toolchain_azure_cli_enabled | bool

# Azure CLI publishes per Ubuntu codename and lags new releases, so probe before
# adding the repo rather than discovering a 404 as an apt failure later.
- name: Check whether Azure CLI publishes for this release
  ansible.builtin.uri:
    url: "https://packages.microsoft.com/repos/azure-cli/dists/{{ ansible_facts['distribution_release'] }}/Release"
    method: HEAD
    status_code: [200, 404]
  register: dev_toolchain_azure_release_probe
  changed_when: false
  # A HEAD request changes nothing, so it runs under --check too. Without this
  # the probe skipped, and the repo task below then resolved `.status` against a
  # skipped register -- "object of type 'dict' has no attribute 'status'" --
  # failing every dry run.
  check_mode: false
  when:
    - dev_toolchain_enabled | bool
    - dev_toolchain_azure_cli_enabled | bool

- name: Add the Azure CLI apt repo
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by={{ dev_toolchain_microsoft_keyring }}]
      https://packages.microsoft.com/repos/azure-cli/
      {{ ansible_facts['distribution_release']
         if (dev_toolchain_azure_release_probe.status | default(404)) == 200
         else dev_toolchain_azure_cli_fallback_release }} main
    filename: azure-cli
    state: present
    update_cache: true
  when:
    - dev_toolchain_enabled | bool
    - dev_toolchain_azure_cli_enabled | bool

- name: Install the Azure CLI
  ansible.builtin.apt:
    name: azure-cli
    state: present
  when:
    - dev_toolchain_enabled | bool
    - dev_toolchain_azure_cli_enabled | bool

- name: Report the installed toolchain
  ansible.builtin.command: "{{ item }} --version"
  register: dev_toolchain_versions
  changed_when: false
  failed_when: false
  loop:
    - make
    - "python{{ dev_toolchain_python_version }}"
    - terraform
    - az
  when: dev_toolchain_enabled | bool
