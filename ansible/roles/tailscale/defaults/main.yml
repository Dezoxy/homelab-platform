---
base_packages:
  - ca-certificates
  - curl
  - gnupg
  - iptables
  - lsb-release

tailscale_repo_release: "{{ ansible_facts['distribution_release'] }}"
tailscale_keyring: /usr/share/keyrings/tailscale-archive-keyring.gpg
tailscale_repo: "deb [signed-by={{ tailscale_keyring }}] https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }} {{ tailscale_repo_release }} main"
tailscale_subnet_snat_service_path: /etc/systemd/system/tailscale-subnet-snat.service
tailscale_subnet_snat_script_path: /usr/local/sbin/tailscale-subnet-snat.sh
tailscale_subnet_snat_source_cidr: 100.64.0.0/10

# These must be set per host in host_vars
# tailscale_auth_key: ""
# tailscale_hostname: ""
# tailscale_advertise_routes: []
# tailscale_advertise_tags: []
# tailscale_accept_dns: false
# tailscale_enable_ssh: false
# tailscale_enable_ipv6_forwarding: false
# tailscale_require_auth_key: true
