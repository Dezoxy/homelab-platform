---
- name: Assert Debian or Ubuntu
  ansible.builtin.assert:
    that: ansible_facts['distribution'] in ["Debian", "Ubuntu"]
    fail_msg: "tailscale role expects Debian or Ubuntu."

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

- name: Ensure Tailscale apt keyring directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Add Tailscale apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ tailscale_repo_release }}.noarmor.gpg"
    dest: "{{ tailscale_keyring }}"
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "{{ tailscale_repo }}"
    filename: tailscale
    state: present

- name: Install tailscale package
  ansible.builtin.apt:
    name: tailscale
    update_cache: true
    state: present

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check /dev/net/tun (required for Tailscale in LXC)
  ansible.builtin.stat:
    path: /dev/net/tun
  register: tailscale_tun

- name: Assert /dev/net/tun is available
  ansible.builtin.assert:
    that:
      - tailscale_tun.stat.exists
      - tailscale_tun.stat.ischr
    fail_msg: >-
      /dev/net/tun is missing. In Proxmox LXC, enable the TUN device for this container
      (bind-mount /dev/net/tun and allow device c 10:200), or run Tailscale in a VM instead.

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    reload: true

- name: Enable IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    state: present
    sysctl_set: true
    reload: true
  when: tailscale_enable_ipv6_forwarding

- name: Derive LAN interface for subnet-route SNAT
  ansible.builtin.set_fact:
    tailscale_lan_interface_effective: "{{ tailscale_lan_interface | default(ansible_facts['default_ipv4']['interface'] | default('eth0')) }}"

- name: Check current Tailscale backend state
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  # Reading status changes nothing, and the enrolment checks below parse its
  # JSON. Skipped under --check it produced '', and from_json failed with
  # "Expecting value: line 1 column 1".
  check_mode: false

- name: Require Tailscale auth key for unenrolled nodes
  ansible.builtin.assert:
    that:
      - tailscale_auth_key | length > 0
    fail_msg: >-
      This node has no authenticated Tailscale state. Set tailscale_auth_key
      (for example via CI secret TAILSCALE_AUTHKEY) for initial enrollment.
  when:
    - tailscale_require_auth_key
    - tailscale_status.rc != 0 or (tailscale_status.stdout | default('{}') | from_json).BackendState == "NeedsLogin"

- name: Bring up Tailscale with auth key (first login)
  ansible.builtin.shell:
    cmd: >-
      tailscale up
      --authkey="${TAILSCALE_AUTHKEY}"
      --hostname={{ tailscale_hostname | quote }}
      --advertise-routes={{ tailscale_advertise_routes | join(',') | quote }}
      --advertise-tags={{ tailscale_advertise_tags | join(',') | quote }}
      --accept-dns={{ tailscale_accept_dns | ternary('true', 'false') }}
      --ssh={{ tailscale_enable_ssh | ternary('true', 'false') }}
  environment:
    TAILSCALE_AUTHKEY: "{{ tailscale_auth_key }}"
  changed_when: true
  when:
    - tailscale_auth_key | length > 0
    - tailscale_status.rc != 0 or (tailscale_status.stdout | default('{}') | from_json).BackendState == "NeedsLogin"

- name: Apply Tailscale router settings (already authenticated)
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --hostname={{ tailscale_hostname }}
      --advertise-routes={{ tailscale_advertise_routes | join(',') }}
      --advertise-tags={{ tailscale_advertise_tags | join(',') }}
      --accept-dns={{ tailscale_accept_dns | ternary('true', 'false') }}
      --ssh={{ tailscale_enable_ssh | ternary('true', 'false') }}
  changed_when: true
  when:
    - tailscale_status.rc == 0
    - (tailscale_status.stdout | default('{}') | from_json).BackendState != "NeedsLogin"

- name: Install subnet-route SNAT helper
  ansible.builtin.template:
    src: subnet-route-snat.sh.j2
    dest: "{{ tailscale_subnet_snat_script_path }}"
    mode: "0755"

- name: Install subnet-route SNAT systemd unit
  ansible.builtin.template:
    src: subnet-route-snat.service.j2
    dest: "{{ tailscale_subnet_snat_service_path }}"
    mode: "0644"

- name: Enable subnet-route SNAT service
  ansible.builtin.systemd:
    name: tailscale-subnet-snat.service
    enabled: true
    state: started
    daemon_reload: true

- name: Verify subnet-route SNAT rule exists
  ansible.builtin.command:
    cmd: >-
      iptables -t nat -C POSTROUTING
      -s {{ tailscale_subnet_snat_source_cidr }}
      -d {{ item }}
      -o {{ tailscale_lan_interface_effective }}
      -j MASQUERADE
  loop: "{{ tailscale_advertise_routes }}"
  changed_when: false

- name: Show effective Tailscale IPs
  ansible.builtin.command:
    cmd: tailscale ip
  register: tailscale_ips
  changed_when: false

- name: Print effective Tailscale IPs
  ansible.builtin.debug:
    var: tailscale_ips.stdout_lines
